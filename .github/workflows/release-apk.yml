name: APK Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'

jobs:
  calidad:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: calidad
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: false
      - name: Versiones
        run: flutter --version && java -version
      - name: Resolver dependencias bloqueadas
        run: flutter pub get --enforce-lockfile
      - name: Construir APK release
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'http://10.0.2.2:18310' }}
        run: flutter build apk --release --no-pub --dart-define="API_BASE_URL=$API_BASE_URL"
      - uses: actions/upload-artifact@v7
        with:
          name: btohabitos-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  publicar:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: btohabitos-apk
          path: artifact
      - name: Verificar etiqueta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null
          gh release create "$TAG" artifact/app-release.apk \
            --verify-tag \
            --title "$TAG" \
            --notes 'APK educativo de BtoHabitos. El artefacto release está firmado con la clave de depuración configurada por Android Gradle; no es una firma de distribución para producción.'
