name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'

jobs:
  backend:
    name: Servidor Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Versiones
        run: python --version && python -m pip --version
      - name: Instalar lock y comprobar dependencias
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements.lock
          .venv/bin/python -m pip check
      - name: Pruebas del servidor
        run: .venv/bin/python -m pytest

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: false
      - name: Versiones
        run: flutter --version && java -version
      - name: Resolver dependencias bloqueadas
        run: flutter pub get --enforce-lockfile
      - name: Analizar
        run: flutter analyze --no-pub
      - name: Pruebas
        run: flutter test --no-pub --reporter expanded

  tool:
    name: Auxiliares
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Pruebas de auxiliares
        run: python -m unittest discover -s tool -p 'test_*.py' -v
